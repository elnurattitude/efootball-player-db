<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eFootball Player Database</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">PLAYER DATABASE</p>
        <h1>eFootball <span>Players</span></h1>
        <p class="sub">Search the player catalogue by name, position, nationality or rating.</p>
      </div>
      <div class="count" id="result-count">Loading…</div>
    </header>

    <section class="filters" aria-label="Player search">
      <label class="search">
        <span>Search players</span>
        <input id="search" type="search" placeholder="Player name…" autocomplete="off">
      </label>
      <label>
        <span>Position</span>
        <select id="position"><option value="">All positions</option></select>
      </label>
      <label>
        <span>Minimum rating</span>
        <select id="rating">
          <option value="">Any rating</option>
          <option value="90">90+</option><option value="95">95+</option>
          <option value="100">100+</option>
        </select>
      </label>
      <button id="clear" class="secondary" type="button">Clear</button>
    </section>

    <p id="status" class="status" role="status">Connecting to database…</p>
    <section id="players" class="players" aria-live="polite"></section>
    <div class="pagination">
      <button id="previous" class="secondary" type="button" disabled>Previous</button>
      <span id="page-label">Page 1</span>
      <button id="next" class="secondary" type="button" disabled>Next</button>
    </div>
    <footer>Independent community catalogue. Not affiliated with KONAMI.</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
