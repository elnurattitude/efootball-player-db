<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="eFootball futbolchilari bazasi — ism va pozitsiya bo‘yicha qidiruv.">
  <title>eFootball Player Database</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">PLAYER DATABASE</p>
        <h1>eFootball <span>Players</span></h1>
        <p class="sub">104 mingdan ortiq futbolchini ism yoki pozitsiya bo‘yicha qidiring.</p>
      </div>
      <div class="count" id="result-count">Yuklanmoqda…</div>
    </header>
    <section class="filters" aria-label="Futbolchilar qidiruvi">
      <label class="search">
        <span>Futbolchi ismi</span>
        <input id="search" type="search" placeholder="Masalan: Yohei Sato…" autocomplete="off">
      </label>
      <label>
        <span>Pozitsiya</span>
        <select id="position"><option value="">Barcha pozitsiyalar</option></select>
      </label>
      <button id="clear" class="secondary" type="button">Tozalash</button>
    </section>
    <p id="status" class="status" role="status">Ma’lumotlar bazasiga ulanmoqda…</p>
    <section id="players" class="players" aria-live="polite"></section>
    <div class="pagination">
      <button id="previous" class="secondary" type="button" disabled>Oldingi</button>
      <span id="page-label">1-sahifa</span>
      <button id="next" class="secondary" type="button" disabled>Keyingi</button>
    </div>
    <footer>Mustaqil hamjamiyat loyihasi. KONAMI bilan bog‘liq emas.</footer>
  </main>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
